listen=YES
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES

chroot_local_user=YES
chroot_list_enable=YES
allow_writeable_chroot=YES
secure_chroot_dir=/etc/vsftpd_empty

pam_service_name=vsftpd
pasv_enable=YES
pasv_address=127.0.0.1
pasv_min_port=21100
pasv_max_port=21110
file_open_mode=0777
local_root=/var/ftp/uploads