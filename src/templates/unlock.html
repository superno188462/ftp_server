<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下载授权</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f7fa;
    color: #2c3e50;
    margin: 0;
    padding: 24px;
  }
  .container { max-width: 420px; margin: 60px auto; }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 24px 28px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  h1 { margin: 0 0 6px; font-size: 20px; }
  .subtitle { color: #7f8c8d; margin-bottom: 20px; font-size: 13px; }
  label { display: block; font-size: 13px; color: #7f8c8d; margin-bottom: 6px; }
  input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #dce1e6;
    border-radius: 6px;
    font-size: 14px;
    background: #fafbfc;
  }
  input[type="password"]:focus { outline: none; border-color: #3498db; background: #fff; }
  button {
    background: #3498db;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
    margin-top: 14px;
  }
  button:hover { background: #2980b9; }
  .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
  .flash.error { background: #fde2e2; color: #b03636; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>🔒 下载授权</h1>
    <div class="subtitle">请输入下载密码以继续</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <input type="hidden" name="next" value="{{ next }}">
      <label>下载密码</label>
      <input type="password" name="password" autofocus required>
      <button type="submit">解锁</button>
    </form>
  </div>
</div>
</body>
</html>
